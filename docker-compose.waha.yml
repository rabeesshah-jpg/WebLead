# WAHA (WhatsApp HTTP API) for Nora AI
# Business number: +923301675395
#
# Loads ${WAHA_*} from the project `.env` (or the shell). Do not hardcode webhook URLs.
#
# Local Django on the host:
#   WAHA_HOOK_URL=http://host.docker.internal:8000/api/webhooks/waha/whatsapp-inbound/
#   WAHA_HOOK_CUSTOM_HEADERS=X-Api-Key:<same as WAHA_API_KEY or WAHA_WEBHOOK_SECRET>
#
# Usage:
#   docker compose -f docker-compose.waha.yml down
#   docker compose -f docker-compose.waha.yml up -d

services:
  waha:
    image: devlikeapro/waha:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    # So http://host.docker.internal resolves to the Docker host (needed on Linux).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      WHATSAPP_DEFAULT_ENGINE: NOWEB
      WAHA_API_KEY: ${WAHA_API_KEY:-}
      # Public base used inside media.url fields (set in production).
      WAHA_BASE_URL: ${WAHA_PUBLIC_BASE_URL:-http://localhost:3000}
      # Inbound WhatsApp → Django (empty disables global webhook until set).
      WHATSAPP_HOOK_URL: ${WAHA_HOOK_URL:-}
      WHATSAPP_HOOK_EVENTS: message
      WHATSAPP_HOOK_CUSTOM_HEADERS: ${WAHA_HOOK_CUSTOM_HEADERS:-}
    volumes:
      - waha_sessions:/app/.sessions
      - waha_media:/app/.media

volumes:
  waha_sessions:
  waha_media:
